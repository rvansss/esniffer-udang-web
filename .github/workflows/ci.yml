name: CI - Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: esniffer
          POSTGRES_PASSWORD: esniffer
          POSTGRES_DB: esniffer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esniffer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://esniffer:esniffer@localhost:5432/esniffer_test
      AUTH_SECRET: ci-auth-secret-at-least-32-characters-long
      CURSOR_SIGNING_SECRET: ci-cursor-secret-at-least-32-characters-long
      APP_BASE_URL: https://ci.esniffer.test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Prisma Client tidak di-generate otomatis oleh `npm ci`,
      # sehingga generate eksplisit diperlukan sebelum typecheck & test.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Lint check
        run: npx eslint .

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Database tests
        run: npm run test:db

      - name: API tests
        run: npm run test:api

      - name: Production Webpack build verification
        run: npm run build -- --webpack

      - name: Real Next.js HTTP Smoke Test
        run: node --experimental-strip-types --test test/e2e/http-smoke.test.ts

  docker-validation:
    name: Docker & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate production Docker Compose configuration
        run: |
          docker compose --env-file deploy/.env.production.example -f deploy/compose.production.yml config --quiet
          echo "Compose configuration syntax and environment bindings valid."

      - name: "Build Web/Worker runtime image (target: runtime)"
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Build Database migration image (target: migration)"
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migration
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
