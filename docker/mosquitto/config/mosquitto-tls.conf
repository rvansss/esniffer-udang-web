# Mosquitto production TLS template. Certificate and credential files are
# mounted read-only at deployment time and are intentionally not in Git.

per_listener_settings true
listener 8883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /mosquitto/secrets/passwords.txt
acl_file /mosquitto/config/acl.txt

cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false

persistence true
persistence_location /mosquitto/data/

message_size_limit 4096
max_inflight_messages 20
max_queued_messages 1000
max_queued_bytes 10485760

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
